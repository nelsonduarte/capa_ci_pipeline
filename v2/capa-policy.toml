# Organization capability-compliance policies for the CI product.
#
# This file is OWNED BY THE ORGANIZATION (security / platform team), not
# by any single package. It states product-wide rules evaluated over the
# COMPOSED capability graph under the Wasm-sandbox posture (pass --wasm to
# --check-policies / --conformance-report so the foreign action
# boundaries compose as bounded nodes of their declared caps).
#
# The composed graph attributes foreign-action capabilities PRECISELY
# per package (compiler main c2011ae, PR #75; see DOGFOOD_FINDINGS.md
# F-1), so every rule below reads each package's real composed authority.

# The pure core library must hold no authority. pipeline_core calls no
# foreign component, so its composed authority is exact and empty.
[[policy]]
id = "core-is-pure"
name = "the pipeline core library holds no authority"
kind = "purity"
package = "pipeline_core"

# The confined-parser rule: the parse action must never hold Net. A
# parser that can reach the network is the classic XXE / malicious
# -manifest exfiltration vector. The parse boundary declares no
# capability, so its composed authority is empty and this passes clean;
# it would fail the moment the parse action gained Net.
[[policy]]
id = "parser-no-net"
name = "the parse action must not hold Net"
kind = "forbid-capability"
capability = "Net"
package = "parse_action"

# The exfil-vector rule: the build action must never hold Net AND Fs at
# once. A build step legitimately needs the filesystem; the moment it
# also gains the network it can read the checkout (secrets, source) and
# ship it out. It passes clean now (build holds only Fs) and FAILS on the
# compromised v2 build action that gains Net.
[[policy]]
id = "build-no-net-and-fs"
name = "the build action must not hold Net and Fs together"
kind = "exclusion"
capabilities = ["Net", "Fs"]
scope = "build_action"

# The whole product's composed authority must stay within {Net, Fs,
# Stdio}. Any package that introduces a capability outside that set fails
# the gate, naming the offending capability and package.
[[policy]]
id = "product-authority"
name = "product authority subset-or-equal {Net, Fs, Stdio}"
kind = "product-subset"
max = ["Net", "Fs", "Stdio"]
